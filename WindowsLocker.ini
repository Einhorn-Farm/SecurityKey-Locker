# WindowsLocker configuration
# Lines starting with # or ; are comments.

# USB Vendor ID (hex, no "0x"). 1050 = Yubico (YubiKey).
VendorId=1050

# Optional USB Product ID (hex, no "0x"). Leave empty to match ANY device
# from the vendor above (recommended - a YubiKey exposes several PIDs).
ProductId=
